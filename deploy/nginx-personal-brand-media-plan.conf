# Add both locations to the HTTP and HTTPS server blocks for karpaleksei.com
# and veselovaveronika.com. The original Host header selects the matching
# site-scoped calendar inside Blog Core.
location = /media-plan {
    proxy_pass http://127.0.0.1:3299/media-plan;
    include /etc/nginx/snippets/build-yas-proxy.conf;
    proxy_cache off;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
    proxy_hide_header X-Robots-Tag;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location ^~ /media-plan/ {
    proxy_pass http://127.0.0.1:3299;
    include /etc/nginx/snippets/build-yas-proxy.conf;
    proxy_cache off;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
    proxy_hide_header X-Robots-Tag;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
